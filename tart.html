rc="assets/images/tart-matcha-scene.png" alt="抹茶产品场景"></figure></div></div><div class="content-block showcase"><h2>完整设计效果</h2><p>将主视觉、系列口味图与应用方向集中呈现，作为项目的最终视觉总结。</p><img class="zoomable" src="assets/images/tart-showcase.jpg" alt="超长蛋挞完整设计展示"></div></section><nav class="project-nav"><a href="illy.html"><small>上一项目</small><strong>← ILLY</strong></a><a href="noodle.html"><small>下一项目</small><strong>面馆 →</strong></a></nav></main><footer class="site-footer"><div class="footer-inner"><span>© <span data-year></span> Zhu Qing</span><span>Concept project</span></div></footer><div class="lightbox"><button>×</button><img alt="放大查看"></div><script src="assets/js/site.js"></script></body></html>
